substitutions:
  name: humsienk
  device_description: "Monitor a Humsienk LiFePO4 battery BMS via BLE"
  # Replace with your battery's Bluetooth MAC address
  mac_address: 45:E0:2F:28:D2:9D

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2025.7.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Use the local components of this repository
external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:

ble_client:
  - mac_address: ${mac_address}
    id: client0

humsienk_bms_ble:
  ble_client_id: client0
  id: bms0
  update_interval: 5s
  # FET/balancer control (charge/discharge) verified against the Humsienk app.
  # Set to false if you want a monitoring-only setup that never writes to the BMS.
  enable_fet_control: true

sensor:
  - platform: humsienk_bms_ble
    humsienk_bms_ble_id: bms0
    total_voltage:
      name: "${name} total voltage"
    current:
      name: "${name} current"
    power:
      name: "${name} power"
    state_of_charge:
      name: "${name} state of charge"
    state_of_health:
      name: "${name} state of health"
    capacity_remaining:
      name: "${name} capacity remaining"
    full_charge_capacity:
      name: "${name} full charge capacity"
    charging_cycles:
      name: "${name} charging cycles"
    min_cell_voltage:
      name: "${name} min cell voltage"
    max_cell_voltage:
      name: "${name} max cell voltage"
    min_voltage_cell:
      name: "${name} min voltage cell"
    max_voltage_cell:
      name: "${name} max voltage cell"
    delta_cell_voltage:
      name: "${name} delta cell voltage"
    average_cell_voltage:
      name: "${name} average cell voltage"
    mosfet_temperature:
      name: "${name} mosfet temperature"
    environment_temperature:
      name: "${name} environment temperature"
    problem_bitmask:
      name: "${name} problem bitmask"
    # 12V pack = 4 cells in series; add more (up to cell_voltage_24) for larger packs
    cell_voltage_1:
      name: "${name} cell voltage 1"
    cell_voltage_2:
      name: "${name} cell voltage 2"
    cell_voltage_3:
      name: "${name} cell voltage 3"
    cell_voltage_4:
      name: "${name} cell voltage 4"
    temperature_1:
      name: "${name} temperature 1"
    temperature_2:
      name: "${name} temperature 2"

binary_sensor:
  - platform: humsienk_bms_ble
    humsienk_bms_ble_id: bms0
    charging:
      name: "${name} charging"
    discharging:
      name: "${name} discharging"
    balancing:
      name: "${name} balancing"
    online_status:
      name: "${name} online status"
    problem:
      name: "${name} problem"

text_sensor:
  - platform: humsienk_bms_ble
    humsienk_bms_ble_id: bms0
    model:
      name: "${name} model"
    hardware_version:
      name: "${name} hardware version"
    errors_bitmask_hex:
      name: "${name} errors bitmask"

# FET / balancer control. Requires enable_fet_control: true above.
# charging/discharging are verified; balancer is documented but not yet captured.
switch:
  - platform: humsienk_bms_ble
    humsienk_bms_ble_id: bms0
    charging:
      name: "${name} charging switch"
    discharging:
      name: "${name} discharging switch"
    # balancer:
    #   name: "${name} balancer switch"

  # Turns the BLE connection to the BMS on and off. Switching it off disconnects
  # the client, so the BMS can be reached by another app (or the phone) in the
  # meantime. Sensors stop updating and go unavailable while it is off.
  - platform: ble_client
    ble_client_id: client0
    name: "${name} enable bluetooth connection"
    id: ble_client_switch0
    restore_mode: RESTORE_DEFAULT_ON
